services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: cuidar-plus-app
    container_name: cuidar-plus-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cuidar

  nginx:
    image: nginx:1.27-alpine
    container_name: cuidar-plus-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - cuidar

  mysql:
    image: mysql:8.0
    container_name: cuidar-plus-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNO:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cuidar_plus}
      MYSQL_USER: ${DB_USERNAME:-cuidar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-dados:/var/lib/mysql
      - ./docker/mysql/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/criar-banco-de-teste.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cuidar

  # Servidor WebSocket. Precisa rodar de forma persistente (não como comando avulso).
  reverb:
    image: cuidar-plus-app
    container_name: cuidar-plus-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT_EXTERNO:-8081}:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - cuidar

  # Worker de fila: as Notifications implementam ShouldQueue.
  queue:
    image: cuidar-plus-app
    container_name: cuidar-plus-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cuidar

  node:
    image: node:22-bookworm-slim
    container_name: cuidar-plus-node
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "[ -d node_modules ] || npm install; npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
    networks:
      - cuidar

  # Testes de frontend. Sobe sob demanda:
  #   docker compose run --rm cypress npx cypress run
  cypress:
    image: cypress/included:15.6.0
    container_name: cuidar-plus-cypress
    profiles: ["testes"]
    working_dir: /var/www/html
    entrypoint: []
    environment:
      CYPRESS_baseUrl: http://nginx
    volumes:
      - .:/var/www/html
    networks:
      - cuidar

networks:
  cuidar:
    driver: bridge

volumes:
  mysql-dados:
