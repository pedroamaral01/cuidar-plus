# Só envia "Connection: Upgrade" quando o cliente realmente pediu o upgrade.
# Sem isso, uma requisição HTTP comum para /app quebra o Reverb.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Resolver do Docker: reavalia o IP do container "app" a cada conexão,
    # em vez de cachear o endereço resolvido quando o nginx subiu. Sem isso,
    # recriar o container app (deploy, restart) derruba o proxy com 502 até
    # o nginx também reiniciar.
    resolver 127.0.0.11 valid=10s;

    # WebSocket do Laravel Reverb.
    # O cliente (Laravel Echo) conecta em http://localhost:8080/app/{chave},
    # e o nginx faz o upgrade HTTP -> WebSocket para o container do Reverb.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Endpoint HTTP do Reverb usado pelo servidor para publicar eventos.
    location /apps {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/cuidar-plus.access.log;
    error_log /var/log/nginx/cuidar-plus.error.log;
}
